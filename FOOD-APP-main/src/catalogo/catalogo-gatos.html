    <!-- Modal de carrito -->

                    </div>

                </div>

                </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Variables globales
    let cart = [];
    let productDetails = '';

    const productos = [
        {
            nombre: "SABROSITOS PESCADO 3kg",
            precio: 7000,
            imagen: "/img/sabrosito gato pesacdo.jpg",
            categoria: 'sabrositos',
            id: 1,
        },
        {
            nombre: "SABROSITOS PESCADO 10kg",
            precio: 21300,
            imagen: "/img/sabrosito gato pesacdo.jpg",
            categoria: 'sabrositos',
            id: 2,
        },
        {
            nombre: "SABROSITOS PESCADO 20kg",
            precio: 40200,
            imagen: "/img/sabrosito gato pesacdo.jpg",
            categoria: 'sabrositos',
            id: 3,
        },
        {
            nombre: "SABROSITOS MIX 3kg",
            precio: 40200,
            imagen: "/img/sabrosito mix gato.jpg",
            categoria: 'sabrositos',
            id: 4,
        },
        {
            nombre: "SABROSITOS MIX 10kg",
            precio: 19500,
            imagen: "/img/sabrosito mix gato.jpg",
            categoria: 'sabrositos',
            id: 5,
        },
        {
            nombre: "SABROSITOS MIX 20kg",
            precio: 37800,
            imagen: "/img/sabrosito mix gato.jpg",
            categoria: 'sabrositos',
            id: 6,
        },
        {
            nombre: "FISHTY 15kg",
            precio: 21000,
            imagen: "/img/fyshi_nuevo-removebg-preview.png",
            categoria: 'fishy',
            id: 7
        },
    ];

    function filterProducts() {
        const selectedBrand = document.getElementById('brand-select').value;
        const productList = document.getElementById('product-list');

        // Limpiar el contenido del producto
        if (selectedBrand === '') {
            productList.innerHTML = ''; 
            return;
        }

        // Filtrar productos por marca seleccionada
        const filteredProducts = productos.filter(producto => 
            producto.categoria === selectedBrand
        );

        // Limpiar el contenido del producto antes de mostrar los filtrados
        productList.innerHTML = '';

        // Mostrar productos filtrados
        if (filteredProducts.length === 0) {
            productList.innerHTML = '<p>No se encontraron productos para esta marca.</p>';
        } else {
            filteredProducts.forEach(producto => {
                const productItem = document.createElement('div');
                productItem.className = 'product-item';
                productItem.innerHTML = `
                    <div class="d-flex align-items-center mt-1 producto">
                        <img src="${producto.imagen}" width="100" height="100%" class="me-2" alt="">
                        <label class="form-check-label product-title">
                            ${producto.nombre}
                            <h5>$${producto.precio}</h5>
                            <button type="button" class="btn btn-danger" style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;" onclick="addProduct('${producto.nombre}', ${producto.precio})">AGREGAR</button>
                        </label>
                    </div>
                `;
                productList.appendChild(productItem);
            });
        }
    }

    // Función para cargar el carrito desde localStorage
    function loadCart() {
        const storedCart = localStorage.getItem('cart');
        if (storedCart) {
            cart = JSON.parse(storedCart);
            updateCart();
        }
    }

    function addProduct(name, price) {
        const product = cart.find(item => item.name === name);
        if (product) {
            product.quantity++;
        } else {
            cart.push({ name, price, quantity: 1 });
        }
        updateCart();
        saveCart();
        
        // Mostrar mensaje de confirmación
        const toast = document.createElement('div');
        toast.className = 'alert alert-success position-fixed top-0 end-0 m-3';
        toast.style.zIndex = '1050';
        toast.innerHTML = `Producto agregado al carrito`;
        document.body.appendChild(toast);
        
        // Eliminar el mensaje después de 2 segundos
        setTimeout(() => {
            toast.remove();
        }, 2000);
    }

    function removeProduct(name) {
        const productIndex = cart.findIndex(item => item.name === name);
        if (productIndex !== -1) {
            cart.splice(productIndex, 1);
            updateCart();
            saveCart();
            
            // Actualizar el contenido del modal sin cerrarlo
            const carritoDetalles = document.getElementById('carrito-detalles');
            if (cart.length > 0) {
                carritoDetalles.innerHTML = cart.map(product => `
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span>${product.name} - ${product.quantity} unidad(es) - $${(product.price * product.quantity).toFixed(2)}</span>
                        <button class="btn btn-danger btn-sm" onclick="removeProduct('${product.name}')">Eliminar</button>
                    </div>
                `).join('');
            } else {
                carritoDetalles.innerHTML = 'No has agregado productos.';
            }

            // Actualizar el total en el modal
            const totalPriceElement = document.getElementById('total-price-banner');
            totalPriceElement.textContent = `TOTAL: $${updateTotalPrice().toFixed(2)}`;
        }
    }

    function updateCart() {
        const botonCarrito = document.getElementById('carrito-info').querySelector('button');
        const totalItems = cart.reduce((total, product) => total + product.quantity, 0);
        botonCarrito.textContent = `Carrito (${totalItems})`;
        updateTotalPrice();
    }

    function updateTotalPrice() {
        productDetails = '';
        const totalPrice = cart.reduce((total, product) => {
            productDetails += `${product.name}: $${product.price.toFixed(2)} x ${product.quantity} unidades\n`;
            return total + (product.price * product.quantity);
        }, 0);

        document.getElementById('total-price').textContent = totalPrice.toFixed(2);
        localStorage.setItem('totalPrice', totalPrice);
        localStorage.setItem('productDetails', productDetails.trim());
        return totalPrice;
    }

    function openModal() {
        const carritoDetalles = document.getElementById('carrito-detalles');
        carritoDetalles.innerHTML = cart.length > 0
            ? cart.map(product => `
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span>${product.name} - ${product.quantity} unidad(es) - $${(product.price * product.quantity).toFixed(2)}</span>
                    <button class="btn btn-danger btn-sm" onclick="removeProduct('${product.name}')">Eliminar</button>
                </div>
            `).join('')
            : 'No has agregado productos.';

        const totalPriceElement = document.getElementById('total-price-banner');
        totalPriceElement.textContent = `TOTAL: $${updateTotalPrice().toFixed(2)}`;
        
        const modal = new bootstrap.Modal(document.getElementById('carritoModal'));
        modal.show();
    }

    function finalizarCompra() {
        if (cart.length === 0) {
            const emptyCartModal = new bootstrap.Modal(document.getElementById('emptyCartModal'));
            emptyCartModal.show();
            return;
        }

        const totalPrice = updateTotalPrice();
        localStorage.setItem('totalPrice', totalPrice);
        localStorage.setItem('productDetails', productDetails.trim());
        window.location.href = "/FOOD-APP-main/src/opciones-pago/pagos.html";
    }

    function saveCart() {
        localStorage.setItem('cart', JSON.stringify(cart));
    }

    // Inicializar cuando el DOM esté listo
    document.addEventListener('DOMContentLoaded', function() {
        loadCart();
        
        // Exponer funciones globalmente
        window.addProduct = addProduct;
        window.removeProduct = removeProduct;
        window.openModal = openModal;
        window.finalizarCompra = finalizarCompra;
    });
    </script>
